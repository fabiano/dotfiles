# enable remote control (socket lets `kitten @` work from inside full-screen
# apps like nvim, which own the tty and break tty-based remote control)
allow_remote_control yes
listen_on unix:@mykitty

# shortcuts
clear_all_shortcuts yes
kitty_mod ctrl+shift

map ctrl+shift+f5       load_config_file
map ctrl+shift+delete   clear_terminal reset active
map ctrl+c              copy_and_clear_or_interrupt
map ctrl+v              paste_from_clipboard
map super+c             copy_and_clear_or_interrupt
map super+v             paste_from_clipboard
map alt+up              previous_window
map alt+down            next_window
map alt+left            previous_window
map alt+right           next_window
map alt+c               close_window
map ctrl+shift+up       move_window up
map ctrl+shift+down     move_window down
map ctrl+shift+left     move_window left
map ctrl+shift+right    move_window right
map ctrl+shift+h        launch --location=hsplit
map ctrl+shift+v        launch --location=vsplit
map ctrl+n              new_window_with_cwd
map ctrl+t              new_tab_with_cwd
map ctrl+shift+tab      previous_tab
map ctrl+tab            next_tab
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+plus     change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0

# font
font_family   Maple Mono NF
font_size     12.0

# cursor
cursor_shape block

# border
hide_window_decorations   yes

# window
draw_minimal_borders        yes
window_border_width         0.5
window_margin_width         0
window_padding_width        5
single_window_margin_width  0
single_window_padding_width 5
placement_strategy          center

# tab
tab_bar_style             separator
tab_bar_edge              bottom
tab_bar_align             left
tab_bar_margin_width      0
tab_bar_margin_height     6 6
tab_separator             ""
tab_title_template        "{fmt.bg.color0} {fmt.bg._2b3045}{fmt.fg._989898} {title} {fmt.bg.color0}"
active_tab_title_template "{fmt.bg.color0} {fmt.bg._2b3045}{fmt.fg.color15} {title} {fmt.bg.color0}"

# clipboard
strip_trailing_spaces smart

# layout
enabled_layouts splits

# macos
macos_show_window_title_in none

# theme (modus-vivendi-tinted)

# black
color0  #0d0e1c
color8  #595959

# red
color1  #ff5f59
color9  #ff6b55

# green
color2  #44bc44
color10 #00c06f

# yellow
color3  #d0bc00
color11 #fec43f

# blue
color4  #2fafff
color12 #79a8ff

# magenta
color5  #feacd0
color13 #b6a0ff

# cyan
color6  #00d3d0
color14 #6ae4b9

# white
color7  #a6a6a6
color15 #ffffff

foreground              #ffffff
background              #0d0e1c
selection_foreground    #ffffff
selection_background    #555a66
url_color               #79a8ff
cursor                  #ff66ff
cursor_text_color       #0d0e1c
active_border_color     #4a4f69
inactive_border_color   #2b3045
bell_border_color       #d0bc00
tab_bar_background      #0d0e1c
