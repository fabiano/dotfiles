# enable mouse support
set -g mouse on

# true color support
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# increase history limit
set -g history-limit 50000

# number windows/panes from 1
setw -g pane-base-index 1
set -g base-index 1

# renumber panes when one closes so there are no gaps
set -g renumber-windows on

# sync copies to the system clipboard via OSC 52
set -g set-clipboard on

# status line
setw -g window-status-current-format " #{pane_title} "
setw -g window-status-current-style "bg=#292929,fg=#c7c7c7"
setw -g window-status-style "bg=#292929,fg=#787878"
setw -g window-status-format " #{pane_title} "
set -g status-interval 1
set -g status-justify centre
set -g status-left ""
set -g status-left-length 0
set -g status-position top
set -g status-right ""
set -g status-right-length 0
set -g status-style "bg=default,fg=#9e9e9e"

# pane navigation
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# reload config using prefix r
bind r source-file ~/.tmux.conf \; display "config reloaded"

